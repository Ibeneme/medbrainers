<svg width="512" height="660" viewBox="0 0 512 660" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Medbrainers loading" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
@font-face{font-family:'Lufga';src:url('https://www.pickars.com/fonts/LufgaMedium.ttf') format('truetype');font-weight:700;font-style:normal;font-display:swap}
.all,.tile,.tl,.tr,.bl,.br,.mark,.sheen,.word,.wipe{animation-duration:4.8s;animation-iteration-count:infinite;animation-timing-function:cubic-bezier(.22,1,.36,1)}
.all{animation-name:all;animation-timing-function:linear}
.tile{animation-name:tile;transform-box:fill-box;transform-origin:center}
.mark{animation-name:mark;transform-box:view-box;transform-origin:256px 256px}
.tl,.tr,.bl,.br{transform-box:fill-box;transform-origin:center}
.tl{animation-name:tl}.tr{animation-name:tr}.bl{animation-name:bl}.br{animation-name:br}
.sheen{animation-name:sheen;animation-timing-function:ease-in-out}
.word{animation-name:word;transform-box:fill-box;transform-origin:center}
.wipe{animation-name:wipe;transform-box:fill-box;transform-origin:left center}
text{font-family:'Lufga','Plus Jakarta Sans','Poppins','Segoe UI',Arial,sans-serif;font-weight:700}

@keyframes all{0%,90%{opacity:1}97%,100%{opacity:0}}
@keyframes tile{0%{opacity:0;transform:scale(.55)}12%{opacity:1;transform:scale(1.05)}18%,100%{opacity:1;transform:scale(1)}}
@keyframes tl{0%,6%{opacity:0;transform:translate(-80px,-80px) rotate(-30deg) scale(.5)}
 28%{opacity:1;transform:translate(5px,5px) rotate(3deg) scale(1.04)}34%,100%{opacity:1;transform:none}}
@keyframes tr{0%,8%{opacity:0;transform:translate(80px,-80px) rotate(30deg) scale(.5)}
 30%{opacity:1;transform:translate(-5px,5px) rotate(-3deg) scale(1.04)}36%,100%{opacity:1;transform:none}}
@keyframes bl{0%,14%{opacity:0;transform:translateY(100px) scale(.7)}
 36%{opacity:1;transform:translateY(-7px) scale(1.02)}42%,100%{opacity:1;transform:none}}
@keyframes br{0%,18%{opacity:0;transform:translateY(100px) scale(.7)}
 40%{opacity:1;transform:translateY(-7px) scale(1.02)}46%,100%{opacity:1;transform:none}}
@keyframes mark{0%,44%{transform:scale(1)}50%{transform:scale(1.07)}58%,100%{transform:scale(1)}}
@keyframes sheen{0%,50%{transform:translateX(0)}66%,100%{transform:translateX(900px)}}
@keyframes word{0%,52%{opacity:0;transform:translateY(18px)}70%,100%{opacity:1;transform:none}}
@keyframes wipe{0%,52%{transform:scaleX(0)}72%,100%{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){.all,.tile,.tl,.tr,.bl,.br,.mark,.sheen,.word,.wipe{animation:none}.sheen{opacity:0}}
</style>
<defs>
 <clipPath id="tileClip"><rect width="512" height="512" rx="64"/></clipPath>
 <clipPath id="wordClip"><rect class="wipe" x="0" y="540" width="512" height="120"/></clipPath>
</defs>
<g class="all">
 <g class="tile"><rect width="512" height="512" rx="64" fill="#830CFA"/></g>
 <g class="mark">
  <path class="tl" d="M131.584 146.797C153.443 125.37 188.534 125.721 209.961 147.58L261.335 199.991L182.174 277.585L130.801 225.174C109.374 203.315 109.724 168.224 131.584 146.797Z" fill="white"/>
  <path class="tr" d="M379.744 146.797C357.885 125.37 322.794 125.721 301.367 147.58L249.993 199.991L329.154 277.585L380.527 225.174C401.954 203.315 401.604 168.224 379.744 146.797Z" fill="white"/>
  <path class="br" d="M340.428 404.812C371.037 404.812 395.852 379.998 395.852 349.389V275.998H285.004V349.389C285.004 379.998 309.818 404.812 340.428 404.812Z" fill="white"/>
  <path class="bl" d="M170.951 403.965C201.561 403.965 226.375 379.151 226.375 348.541V275.151H115.527L115.527 348.541C115.527 379.151 140.342 403.965 170.951 403.965Z" fill="white"/>
 </g>
 <g clip-path="url(#tileClip)"><polygon class="sheen" points="-260,0 -140,0 -240,512 -360,512" fill="white" fill-opacity=".22"/></g>
 <g clip-path="url(#wordClip)">
  <g class="word"><text x="256" y="624" text-anchor="middle" font-size="76" fill="#830CFA" stroke="#830CFA" stroke-width="1.5" stroke-linejoin="round" paint-order="stroke" letter-spacing="-1">medbrainers</text></g>
 </g>
</g>
</svg>
